name: AI-Bopomofo headless validation
on:
  workflow_dispatch:
  push:
    branches: ['feature/**', 'fix/**', 'research/**', 'release/**', 'main']
  pull_request:
concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test pure logic and compile hosted tests without launching an IME
        run: scripts/test-headless.sh
      - name: Build local unsigned release
        run: scripts/build.sh Release
      - name: Package and validate
        run: |
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Source/McBopomofo-Info.plist)
          package_version="${bundle_version}-ci.${GITHUB_RUN_NUMBER}"
          scripts/package.sh "$package_version" Release
          scripts/verify-package.sh "dist/$package_version"
